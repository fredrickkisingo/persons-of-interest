services:
  # PHP Service
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-php
    volumes:
      - ./laravel:/var/www/html
    networks:
      - laravel-vue-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./laravel:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel-vue-network

  # Node.js Service
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: vue-node
    volumes:
      - ./vue:/app
    ports:
      - "8081:8080"
    networks:
      - laravel-vue-network

  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-vue-network



# Volumes
volumes:
  mysql-data:
    driver: local

# Networks
networks:
  laravel-vue-network:
    driver: bridge